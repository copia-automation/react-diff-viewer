name: Build & Test
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      WORKING_DIRECTORY: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '${{ env.WORKING_DIRECTORY }}/yarn.lock'

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      WORKING_DIRECTORY: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '${{ env.WORKING_DIRECTORY }}/yarn.lock'

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
