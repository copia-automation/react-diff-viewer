name: Build & Test
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      WORKING_DIRECTORY: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "${{ env.WORKING_DIRECTORY }}/yarn.lock"

      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      WORKING_DIRECTORY: ./
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"
          cache-dependency-path: "${{ env.WORKING_DIRECTORY }}/yarn.lock"

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
